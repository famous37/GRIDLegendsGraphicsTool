name: Build English APK
on:
  push:
    branches: [english-edition]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "Android SDK: ${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms" || true
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Build signed debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Name English APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GRID-Legends-Graphics-Tool-v1.4.0-English.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GRID-Legends-Graphics-Tool-v1.4.0-English
          path: GRID-Legends-Graphics-Tool-v1.4.0-English.apk
          retention-days: 30
      - name: Publish English GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.4.0-en"
          APK="GRID-Legends-Graphics-Tool-v1.4.0-English.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "GRID Legends Graphics Tool v1.4.0 — English Edition" \
              --notes "English localization of GRID Legends Graphics Tool v1.4.0. Unofficial community build. Back up your preferences file before editing. Debug-signed APK; this build has not been device-tested."
          fi
